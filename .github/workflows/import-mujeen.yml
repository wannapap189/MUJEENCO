name: Import approved MUJEEN media

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-mujeen.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mujeenco-initial-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import and verify approved images, fonts and videos
        run: python3 scripts/import-media.py
      - name: Check all website references
        run: node scripts/check.mjs
      - name: Commit the complete frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets videos
          git commit -m 'Complete MUJEEN frontend with verified media'
          git push origin HEAD:main
